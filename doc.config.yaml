# Configuración del sitio. El menú está en menu.yaml, las páginas en docs/,
# los datos estructurados en catalogo/ y los diagramas en diagramas/.
#
# Las claves de este fichero y de cada _tipo.yaml (nombre, cabecera, campos,
# tipo: texto...) son el contrato de la plataforma y se leen tal cual. Los
# valores, los ids de tipo y los nombres de campo son propios de este sitio.

nombre: Escribir documentación
descripcion: Cómo escribir un repositorio de contenido que publique la plataforma doc, desde la primera página hasta el menú, el catálogo y los diagramas
plataforma: "1" # versión mayor del contrato de la plataforma a la que apunta este sitio

# Campos extra de cabecera para las páginas. La plataforma ya da a cada página
# titulo, descripcion, icono, orden y actualizado. Estos usan los mismos tipos
# de campo que el catálogo (ver catalogo/*/_tipo.yaml).
cabecera:
  files:
    tipo: lista
    de: { tipo: ref, a: files }
    opcional: true
    descripcion: Ficheros de un repositorio de contenido que explica la página
  components:
    tipo: lista
    de: { tipo: ref, a: components }
    opcional: true
    descripcion: Componentes de página que explica la página
  open_questions:
    tipo: lista
    de: { tipo: texto }
    opcional: true
    descripcion: Preguntas aún abiertas; una ronda de preguntas las responde (/questions)
