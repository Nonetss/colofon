# La barra lateral. Cada grupo lista, en orden, las páginas y carpetas de docs/
# que muestra (una carpeta trae todas sus páginas) y las páginas del catálogo
# (catalog, o catalog/<tipo>). Lo que ningún grupo muestra acaba en un último
# grupo "Otros". Los títulos e iconos escritos aquí mandan sobre los de las
# cabeceras de las páginas.

sections:
  - title: Empezar
    icon: rocket
    description: Las piezas del sistema, cómo se arranca en local y cómo se configura
    pages:
      - { path: arquitectura, icon: blocks }
      - { path: desarrollo, icon: terminal }
      - { path: configuracion, icon: settings }

  - title: La plataforma
    icon: book-open
    description: Los repositorios de contenido, el lector, el editor y lo que se sirve a los agentes
    pages:
      - { path: contenido, icon: book-open }

  - title: Backend
    icon: server
    description: La API, la autenticación y las tareas programadas
    pages:
      - { path: backend-api, icon: braces }
      - { path: autenticacion, icon: shield-check }
      - { path: crons, icon: clock }

  - title: Frontend
    icon: app-window
    description: La web y las piezas que se enganchan a cualquier entidad
    pages:
      - { path: frontend, icon: layout-dashboard }
      - { path: transversales, icon: puzzle }

  - title: Operación
    icon: container
    description: Los compose, las imágenes, el CI y la instalación en un servidor
    pages:
      - { path: docker-despliegue, icon: ship }

  - title: Trabajar en el repositorio
    icon: git-branch
    description: Estilo de código, idiomas, commits, migraciones y el flujo de OpenSpec
    pages:
      - { path: convenciones, icon: book-check }

  - title: Referencia
    icon: table
    description: Los workspaces, las variables de entorno, los comandos y los compose, como tablas
    pages:
      - { path: catalog, title: Catálogo }
