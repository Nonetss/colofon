name: Workspace
plural: Workspaces
icon: package
description: Las carpetas del monorepo con identidad propia, sean workspaces de Bun o no (el gateway). El id es el nombre de la carpeta (frontend, api, content)
title_field: path

fields:
  path:
    type: text
    description: Su carpeta desde la raíz del repositorio (apps/frontend)
  package:
    type: text
    optional: true
    description: El nombre de su package.json (@nonete/api, frontend); sin él, no es un workspace de Bun
  kind:
    type: enum
    values: [app, package, other]
    description: "app: una aplicación de apps/; package: una librería compartida de packages/; other: una carpeta que no es workspace (se construye con otra herramienta)"
  purpose:
    type: text
    description: Una línea sobre para qué sirve
  page:
    type: page
    optional: true
    description: La página que lo explica

view:
  columns: [path, package, purpose]
