name: Variable de entorno
plural: Variables de entorno
icon: variable
description: Las variables del .env de la raíz y de los compose. El id es el nombre de la variable en minúsculas y con guiones (DATABASE_URL → database-url)
title_field: name

fields:
  name:
    type: text
    description: El nombre tal como se escribe en el .env
  area:
    type: enum
    values: [runtime, database, auth, secrets, content, services, web, gateway, compose]
    description: "La sección de .env.example en la que está; web: las variables de cliente de packages/env/src/web.ts; compose: la base de datos y el puerto publicado de los compose"
  required:
    type: boolean
    description: Si el backend o el frontend no arrancan sin ella
  default:
    type: text
    optional: true
    description: El valor que toma si no se define, cuando tiene uno
  meaning:
    type: text
    description: Qué significa, en una línea
  page:
    type: page
    optional: true
    description: La página que la explica

view:
  columns: [name, required, meaning]
