name: Comando
plural: Comandos
icon: square-terminal
description: Los scripts del package.json de la raíz. El id es el nombre del script con guiones en lugar de dos puntos (dev:local → dev-local)
title_field: command

fields:
  command:
    type: text
    description: Cómo se ejecuta (bun run dev:local)
  area:
    type: enum
    values: [dev, validation, database, docker, services, other]
    description: "dev: arrancar el proyecto en desarrollo; validation: comprobar un cambio; database: Drizzle; docker: el stack tipo producción; services: la base de datos de desarrollo suelta; other: el resto"
  purpose:
    type: text
    description: Qué hace, en una línea
  page:
    type: page
    optional: true
    description: La página que lo explica

view:
  columns: [command, purpose]
