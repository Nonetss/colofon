      min-height: 100vh;

    .frame {
      max-width: 1200px;
      width: 100%;

    .diagram-container {

      overflow-x: auto;

    .eyebrow {

      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted-foreground);
      margin-bottom: 0.5rem;

    h1 {

      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: var(--foreground);

    }
    svg {
      width: 100%;
      min-width: 960px;
      display: block;
    }
    @media print {
      .diagram-container {

      svg {
