# Production-like stack built from this checkout: `bun run docker:up`.
# The gateway is the only published service; the app is on
# http://localhost:${FRONTEND_PORT:-4444}.
name: doc

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: doc-frontend
    init: true
    # Reached only through the gateway, which publishes the site
    expose:
      - "4321"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:4321/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: doc-backend
    init: true
    expose:
      - "3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/doc
      # Better Auth's base URL is the public origin: OAuth callbacks are built
      # from it, so it must be what the browser reaches through the gateway.
      BETTER_AUTH_URL: http://localhost:${FRONTEND_PORT:-4444}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-4444}
    volumes:
      # One clone per content repository (stored in the database), kept
      # across container recreations.
      - content_data:/app/.content
      # The bare repository of each hosted content repository: possibly the
      # only copy of its content, so apart from the disposable clones.
      - hosted_data:/app/.hosted
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Gateway (apps/gateway/Caddyfile): the public entry point on :80, routing
  # /rpc, /api, /scalar and /openapi.json to the backend and the rest to the
  # frontend.
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: doc-gateway
    ports:
      - "${FRONTEND_PORT:-4444}:80"
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: doc-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: doc
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d doc" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  content_data:
  hosted_data:
  db_data:
