# Docker dev stack: every app runs its own hot-reload server from source and
# `docker compose watch` syncs edits into the containers (no bind mounts, so
# node_modules stays the containers' own; only named volumes for caches/data).
#
#   bun run dev        # build, start and watch (Ctrl+C stops)
#   bun run dev:down   # remove the containers
#   bun run postgres:start # only PostgreSQL on 127.0.0.1:5432, for native dev
#
# Like production, the gateway is the only service that publishes a port:
# https://localhost:4321 (local CA, HTTP/2). The apps and PostgreSQL stay on the
# stack's private network and reach each other by service name; the
# `environment` overrides below swap .env's localhost addresses for those
# names, everything else comes from the root .env unchanged. Native dev
# (`bun run dev:local` + `bun run gateway`) uses the same ports on the host:
# run one or the other, not both.
#
# The database is the stack's own `db` (data in the db_data volume): the
# backend's DATABASE_URL is overridden to reach it, whatever .env says. The
# backend applies the committed migrations and seeds the admin on boot.
name: doc-dev

x-node-ignore: &node-ignore
  - node_modules/
  - dist/
  - .astro/
  - .turbo/

# Same image, database and healthcheck as compose.yml's db.
x-db: &db
  image: postgres:17
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    POSTGRES_DB: doc
  volumes:
    - db_data:/var/lib/postgresql/data
  healthcheck:
    test: [ "CMD-SHELL", "pg_isready -U postgres -d doc" ]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s
  restart: unless-stopped

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: http://backend:3000
    expose:
      - "4320"
    depends_on:
      - backend
    # Vite's optimized-dependency cache outlives container recreation, so a
    # fresh `bun run dev` doesn't re-optimize and force a reload on the first
    # page load. Vite re-optimizes on its own when the lockfile or config
    # hash changes; `bun run dev:down -v` resets it by hand.
    volumes:
      - frontend_vite_cache:/app/apps/frontend/node_modules/.vite
    develop:
      watch:
        - action: sync
          path: ./apps/frontend/src
          target: /app/apps/frontend/src
          ignore: *node-ignore
        - action: sync
          path: ./apps/frontend/public
          target: /app/apps/frontend/public
        - action: sync
          path: ./packages/api/src
          target: /app/packages/api/src
        - action: sync
          path: ./packages/auth/src
          target: /app/packages/auth/src
        - action: sync
          path: ./packages/env/src
          target: /app/packages/env/src
        - action: sync
          path: ./packages/logger/src
          target: /app/packages/logger/src
        - action: sync+restart
          path: ./apps/frontend/astro.config.mjs
          target: /app/apps/frontend/astro.config.mjs
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./apps/frontend/package.json

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/doc
    volumes:
      # One clone per content repository (stored in the database), kept
      # across container recreations.
      - content_data:/app/.content
      # The bare repository of each hosted content repository: possibly the
      # only copy of its content, so apart from the disposable clones.
      - hosted_data:/app/.hosted
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # The backend's own source hot-reloads (`bun --hot`). Synced edits to
        # the workspace packages below were seen not to reload it, leaving a
        # stale backend, so they restart the container (a few seconds).
        - action: sync
          path: ./apps/backend/src
          target: /app/apps/backend/src
          ignore: *node-ignore
        - action: sync+restart
          path: ./packages/api/src
          target: /app/packages/api/src
        - action: sync+restart
          path: ./packages/auth/src
          target: /app/packages/auth/src
        - action: sync+restart
          path: ./packages/content/src
          target: /app/packages/content/src
        - action: sync+restart
          path: ./packages/cron/src
          target: /app/packages/cron/src
        - action: sync+restart
          path: ./packages/db/src
          target: /app/packages/db/src
        - action: sync+restart
          path: ./packages/env/src
          target: /app/packages/env/src
        - action: sync+restart
          path: ./packages/logger/src
          target: /app/packages/logger/src
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./apps/backend/package.json

  # The only published port: https://localhost:4321 (Caddyfile.dev: local CA,
  # HTTP/2) with the production routing to the backend and to `astro dev` on
  # the private network. The CA persists in gateway_data (`bun run dev:cert`).
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile.dev
      - --adapter
      - caddyfile
    ports:
      - "4321:4321"
    environment:
      BACKEND_HTTP_UPSTREAM: backend:3000
      FRONTEND_HTTP_UPSTREAM: frontend:4320
    volumes:
      - gateway_data:/data
    depends_on:
      - backend
      - frontend
    develop:
      watch:
        - action: sync+restart
          path: ./apps/gateway/Caddyfile.dev
          target: /etc/caddy/Caddyfile.dev
        - action: sync+restart
          path: ./apps/gateway/routes.caddy
          target: /etc/caddy/routes.caddy

  # The dev database, on the private network only (the backend's
  # DATABASE_URL override). The backend waits for it to be healthy.
  db:
    <<: *db
    container_name: doc-dev-db
    expose:
      - "5432"

  # The same PostgreSQL for native dev (`bun run postgres:start` /
  # `postgres:stop`, profile `native`), published on 127.0.0.1:5432 (or
  # POSTGRES_PORT when that is taken), the DATABASE_URL in .env.example.
  # `bun run dev` never starts it; it shares db_data, so run one or the other.
  db-native:
    <<: *db
    container_name: doc-dev-db-native
    profiles:
      - native
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

volumes:
  content_data:
  hosted_data:
  db_data:
  frontend_vite_cache:
  gateway_data:
