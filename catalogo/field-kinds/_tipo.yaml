nombre: Tipo de campo
plural: Tipos de campo
icono: shapes
descripcion: Los tipos que puede tener un campo de catálogo o un campo de la cabecera de una página. El id es el tipo tal como se escribe en `tipo`

campos:
  family:
    tipo: enum
    valores: [scalar, choice, reference, composite]
    descripcion: "scalar: un único valor; choice: uno de una lista; reference: apunta a otra cosa; composite: contiene otros campos"
  value:
    tipo: texto
    descripcion: Qué aspecto tiene un valor de este tipo
  takes:
    tipo: texto
    opcional: true
    descripcion: La clave adicional que necesita la declaración (valores, a, de, campos)
  example:
    tipo: texto
    descripcion: Una declaración y un valor, tal como se escriben

vista:
  columnas: [id, value, takes, example]
