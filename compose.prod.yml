name: doc

services:
  frontend:
    image: ghcr.io/nonetss/stack-frontend:main
    container_name: doc-frontend
    init: true
    # Reached only through the gateway, which publishes the site
    expose:
      - "4321"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:4321/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - doc

  backend:
    image: ghcr.io/nonetss/stack-backend:main
    container_name: doc-backend
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      # Better Auth's base URL is the public URL: OAuth callbacks are built
      # from it. It reuses CORS_ORIGIN from .env so both always match.
      BETTER_AUTH_URL: ${CORS_ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # CORS_ORIGIN (the public URL) comes from .env. `environment`
      # overrides `env_file`.
      CONTENT_DIR: ${CONTENT_DIR:+/content}
    env_file: .env
    volumes:
      # The content: a CONTENT_DIR from .env is mounted read-only at /content
      # and the variable pointed there; unset, it stays unset (and /content
      # gets an empty volume). A CONTENT_REPO clone lives in content_data.
      - ${CONTENT_DIR:-content_unset}:/content:ro
      - content_data:/app/.content
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - doc

  # Gateway (apps/gateway/Caddyfile): the only published service. Its :80
  # site routes /rpc, /api, /scalar and /openapi.json to the backend and the
  # rest to the frontend.
  gateway:
    image: ghcr.io/nonetss/stack-gateway:main
    container_name: doc-gateway
    ports:
      # Host port comes from .env (scripts/bootstrap.sh prompts for it); the
      # default keeps `docker compose up` working with no FRONTEND_PORT set.
      - "${FRONTEND_PORT:-4444}:80"
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - doc

  db:
    image: postgres:17
    container_name: doc-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: doc
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d doc" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - doc

volumes:
  content_data:
  content_unset:
  db_data:

networks:
  doc:
    driver: bridge
