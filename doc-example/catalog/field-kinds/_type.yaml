name: Tipo de campo
plural: Tipos de campo
icon: shapes
description: Los tipos que puede tener un campo de catálogo o un campo de la cabecera de una página. El id es el tipo tal como se escribe en `type`

fields:
  family:
    type: enum
    values: [scalar, choice, reference, composite]
    description: "scalar: un único valor; choice: uno de una lista; reference: apunta a otra cosa; composite: contiene otros campos"
  value:
    type: text
    description: Qué aspecto tiene un valor de este tipo
  takes:
    type: text
    optional: true
    description: La clave adicional que necesita la declaración (values, to, of, fields)
  example:
    type: text
    description: Una declaración y un valor, tal como se escriben

view:
  columns: [id, value, takes, example]
