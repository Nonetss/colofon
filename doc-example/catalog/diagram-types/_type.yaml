name: Tipo de diagrama
plural: Tipos de diagrama
icon: chart-pie
description: Las formas de diagrama que la plataforma coloca sola a partir de los datos. El id es el valor de `type` en el fichero del diagrama
title_field: name

fields:
  name:
    type: text
    description: Su nombre en la guía
  family:
    type: enum
    values: [graph, time, concept, chart, comparison]
    description: "graph: cajas unidas por flechas; time: pasos en el tiempo o por carriles; concept: ideas en un espacio; chart: valores; comparison: un antes y un después"
  purpose:
    type: text
    description: Para qué sirve, en una línea
  keys:
    type: text
    description: Sus claves propias, además de type, title y desc
  variants:
    type: text
    optional: true
    description: Los valores de variant que admite
  budget:
    type: text
    description: Su límite de complejidad; pasarlo se avisa y el diagrama se dibuja igual
  page:
    type: page
    optional: true
    description: La página que lo explica

view:
  columns: [id, purpose, variants, budget]
