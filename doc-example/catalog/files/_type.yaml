name: Fichero
plural: Ficheros
icon: file-code
description: Los ficheros y carpetas que puede contener un repositorio de contenido. El id es un nombre corto para cada uno
title_field: path

fields:
  path:
    type: text
    description: Dónde va, desde la raíz del repositorio (menu.yaml, docs/**/*.mdx)
  kind:
    type: enum
    values: [declaration, content, agents]
    description: "declaration: se lee primero, y si está rota se conserva la última versión válida; content: se lee junto con las páginas; agents: para agentes de IA"
  required:
    type: boolean
    description: Si todo repositorio lo necesita
  purpose:
    type: text
    description: Una línea sobre lo que contiene
  page:
    type: page
    optional: true
    description: La página que lo explica

view:
  columns: [path, kind, required, purpose]
