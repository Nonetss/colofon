# Configuración del sitio. El menú está en menu.yaml, las páginas en docs/,
# los datos estructurados en catalog/ y los diagramas en diagrams/.
#
# Las claves de este fichero y de cada _type.yaml (name, header, fields,
# type: text...) son el contrato de la plataforma, en inglés, y se leen tal
# cual. Los valores, los ids de tipo y los nombres de campo son propios de
# este sitio.

name: Escribir documentación
description: Cómo escribir un repositorio de contenido que publique la plataforma doc, desde la primera página hasta el menú, el catálogo y los diagramas
contract: "2" # versión mayor del contrato de la plataforma a la que apunta este sitio

# Campos extra de cabecera para las páginas. La plataforma ya da a cada página
# title, description, icon, order y updated. Estos usan los mismos tipos
# de campo que el catálogo (ver catalog/*/_type.yaml).
header:
  files:
    type: list
    of: { type: ref, to: files }
    optional: true
    description: Ficheros de un repositorio de contenido que explica la página
  components:
    type: list
    of: { type: ref, to: components }
    optional: true
    description: Componentes de página que explica la página
  diagram_types:
    type: list
    of: { type: ref, to: diagram-types }
    optional: true
    description: Tipos de diagrama que explica la página
  open_questions:
    type: list
    of: { type: text }
    optional: true
    description: Preguntas aún abiertas; una ronda de preguntas las responde (colofon-questions)
