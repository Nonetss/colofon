<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <title>Un repositorio de contenido, despiezado</title>
  <desc>Las tres carpetas de un repositorio de contenido separadas como capas: docs con las páginas arriba, catalog con los datos en medio y diagrams abajo</desc>
  <line class="soft" x1="80" y1="112" x2="80" y2="332" stroke-width="1" stroke-dasharray="3 4"/>
  <line class="soft" x1="320" y1="112" x2="320" y2="332" stroke-width="1" stroke-dasharray="3 4"/>
  <line class="soft" x1="200" y1="112" x2="200" y2="332" stroke-width="1" stroke-dasharray="3 4"/>
  <g>
    <polygon class="muted" points="80,320 200,380 200,392 80,332"/>
    <polygon class="soft" points="200,380 320,320 320,332 200,392"/>
    <polygon class="paper" points="200,260 320,320 200,380 80,320"/>
    <polygon class="ink" points="200,260 320,320 200,380 80,320" fill="none" stroke-width="1.2"/>
    <line class="muted" x1="320" y1="320" x2="400" y2="320" stroke-width="1"/>
    <circle class="ink" cx="320" cy="320" r="3"/>
    <text class="ink" x="412" y="318" font-size="14" font-weight="600">diagrams/</text>
    <text class="muted" x="412" y="336" font-size="12">un fichero por diagrama</text>
  </g>
  <g>
    <polygon class="muted" points="80,210 200,270 200,282 80,222"/>
    <polygon class="soft" points="200,270 320,210 320,222 200,282"/>
    <polygon class="paper" points="200,150 320,210 200,270 80,210"/>
    <polygon class="ink" points="200,150 320,210 200,270 80,210" fill="none" stroke-width="1.2"/>
    <line class="muted" x1="320" y1="210" x2="400" y2="210" stroke-width="1"/>
    <circle class="ink" cx="320" cy="210" r="3"/>
    <text class="ink" x="412" y="208" font-size="14" font-weight="600">catalog/</text>
    <text class="muted" x="412" y="226" font-size="12">los tipos y sus entidades</text>
  </g>
  <g>
    <polygon class="muted" points="80,100 200,160 200,172 80,112"/>
    <polygon class="soft" points="200,160 320,100 320,112 200,172"/>
    <polygon class="accent-soft" points="200,40 320,100 200,160 80,100"/>
    <polygon class="accent" points="200,40 320,100 200,160 80,100" fill="none" stroke-width="1.2"/>
    <line class="muted" x1="320" y1="100" x2="400" y2="100" stroke-width="1"/>
    <circle class="accent" cx="320" cy="100" r="3"/>
    <text class="ink" x="412" y="98" font-size="14" font-weight="600">docs/</text>
    <text class="muted" x="412" y="116" font-size="12">las páginas</text>
  </g>
</svg>
