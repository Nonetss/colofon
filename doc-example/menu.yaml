# La barra lateral. Cada grupo lista, en orden, las páginas y carpetas de docs/
# que muestra (una carpeta trae todas sus páginas) y las páginas del catálogo
# (catalog, o catalog/<tipo>). Lo que ningún grupo muestra acaba en un último
# grupo "Otros". Los títulos e iconos escritos aquí mandan sobre los de las
# cabeceras de las páginas.

sections:
  - title: Inicio
    icon: rocket
    description: Qué es un repositorio de contenido y cómo publicar uno
    pages:
      - { path: getting-started, icon: compass }
      - { path: repository, icon: folder-tree }

  - title: Escritura
    icon: pen-line
    description: Las páginas, su cabecera, el Markdown y los componentes
    pages:
      - { path: pages, icon: file-text }
      - { path: diagrams, icon: workflow }

  - title: Datos
    icon: database
    description: El catálogo, desde declarar un tipo hasta explorarlo en el lector
    pages:
      - { path: data, icon: table }
      - { path: catalog, title: Referencia }

  - title: Publicación
    icon: send
    description: Cómo un push se convierte en el sitio publicado y cómo trabajan con él los agentes
    pages:
      - { path: publishing, icon: git-branch }
