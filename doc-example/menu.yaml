# La barra lateral. Cada grupo lista, en orden, las páginas y carpetas de docs/
# que muestra (una carpeta trae todas sus páginas) y las páginas del catálogo
# (catalogo, o catalogo/<tipo>). Lo que ningún grupo muestra acaba en un último
# grupo "Otros". Los títulos e iconos escritos aquí mandan sobre los de las
# cabeceras de las páginas.

secciones:
  - titulo: Inicio
    icono: rocket
    descripcion: Qué es un repositorio de contenido y cómo publicar uno
    paginas:
      - { ruta: getting-started, icono: compass }
      - { ruta: repository, icono: folder-tree }

  - titulo: Escritura
    icono: pen-line
    descripcion: Las páginas, su cabecera, el Markdown y los componentes
    paginas:
      - { ruta: pages, icono: file-text }
      - { ruta: diagrams, icono: workflow }

  - titulo: Datos
    icono: database
    descripcion: El catálogo, desde declarar un tipo hasta explorarlo en el lector
    paginas:
      - { ruta: catalog, icono: table }
      - { ruta: catalogo, titulo: Referencia }

  - titulo: Publicación
    icono: send
    descripcion: Cómo un push se convierte en el sitio publicado y cómo trabajan con él los agentes
    paginas:
      - { ruta: publishing, icono: git-branch }
